name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag, versions, and ancestry
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -1)" = "$version"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)" = "$version"
          test "$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)" = "$version"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ffmpeg-source-materials:
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect exact FFmpeg source and build materials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-materials
          curl --fail --location --retry 3 \
            https://github.com/BtbN/FFmpeg-Builds/archive/refs/tags/autobuild-2026-06-30-13-34.tar.gz \
            --output source-materials/FFmpeg-Builds-autobuild-2026-06-30-13-34.tar.gz
          curl --fail --location --retry 3 \
            https://github.com/FFmpeg/FFmpeg/archive/ce3c09c101c83add623774d414a9f9498caf5c25.tar.gz \
            --output source-materials/FFmpeg-ce3c09c101c83add623774d414a9f9498caf5c25.tar.gz
          curl --fail --location --retry 3 \
            https://github.com/FFmpeg/nv-codec-headers/archive/33a9ede8d9914299d9262539c576a15bd0a19621.tar.gz \
            --output source-materials/nv-codec-headers-33a9ede8d9914299d9262539c576a15bd0a19621.tar.gz
          curl --fail --location --retry 3 \
            https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n8.1.2.tar.gz \
            --output source-materials/FFmpeg-n8.1.2.tar.gz
          curl --fail --location --retry 3 \
            https://git.martin-riedl.de/ffmpeg/build-script/archive/bb1d6db29cee948f9685bcd69e6caf17d960662b.tar.gz \
            --output source-materials/martin-riedl-build-script-bb1d6db29cee948f9685bcd69e6caf17d960662b.tar.gz
          cp src-tauri/resources/FFMPEG_NOTICE.md source-materials/
          cp packaging/components.json source-materials/
          (
            cd source-materials
            sha256sum -- * > SHA256SUMS
          )
          tar --create --zstd --file yt-dlp-desktop-ffmpeg-source-materials.tar.zst source-materials
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-source-materials
          path: yt-dlp-desktop-ffmpeg-source-materials.tar.zst
          if-no-files-found: error

  package:
    needs: verify-release
    timeout-minutes: 60
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # pnpm/action-setup v6 can't switch pnpm versions on macOS Intel
      # (ERR_PNPM_PNPM_ENGINE_IDENTITY_UNVERIFIABLE), so pnpm is pinned to the version
      # the action bundles (11.25.0 in v6.1.0). Update both together.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          cache: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Prepare Windows sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-sidecars.ps1 -Target '${{ matrix.target }}'
      - name: Prepare Unix sidecars
        if: runner.os != 'Windows'
        run: ./scripts/prepare-sidecars.sh '${{ matrix.target }}'
      - name: Verify Windows sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-sidecars.ps1 -Target '${{ matrix.target }}'
      - name: Verify Unix sidecars
        if: runner.os != 'Windows'
        run: bash ./scripts/verify-sidecars.sh '${{ matrix.target }}'
      - run: pnpm tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      # The app updates itself from these packages. Each one is signed with the
      # updater key, bound to this version; macOS updates use the zipped .app.
      - name: Sign update packages
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ -d "$bundle/macos" ]; then
            target='${{ matrix.target }}'
            tar -czf "$bundle/macos/yt-dlp.Desktop_${version}_${target%%-*}.app.tar.gz" -C "$bundle/macos" "yt-dlp Desktop.app"
          fi
          find "$bundle" -type f \( -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.app.tar.gz' \) -print0 |
            while IFS= read -r -d '' file; do
              pnpm tauri signer sign --app-version "$version" "$file"
              test -s "$file.sig"
            done
      - name: Generate Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle" -Recurse -File -Include *.exe,*.msi | ForEach-Object {
            $name = $_.Name -replace ' ', '.'
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $name
          } | Set-Content -Encoding ascii "SHA256SUMS-${{ matrix.target }}.txt"
      - name: Generate Unix checksums
        if: runner.os != 'Windows'
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            name="$(basename "$file" | tr ' ' '.')"
            printf '%s  %s\n' "$(shasum -a 256 "$file" | awk '{print $1}')" "$name"
          done < <(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' \) -print0) > "SHA256SUMS-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: error

  publish-release:
    needs: [package, ffmpeg-source-materials]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      # The app reads releases/latest/download/latest.json. GitHub replaces spaces
      # in asset names with dots, so the URLs do too.
      - name: Write the update manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          entry() {
            local file
            file="$(find artifacts -type f -name "$1" | head -n 1)"
            test -n "$file" && test -s "$file.sig"
            jq -n --arg url "$base/$(basename "$file" | tr ' ' '.')" --rawfile signature "$file.sig" \
              '{url: $url, signature: ($signature | rtrimstr("\n"))}'
          }
          windows="$(entry '*_x64-setup.exe')"
          mac_intel="$(entry '*_x86_64.app.tar.gz')"
          mac_arm="$(entry '*_aarch64.app.tar.gz')"
          appimage="$(entry '*.AppImage')"
          deb="$(entry '*.deb')"
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson windows "$windows" --argjson mac_intel "$mac_intel" --argjson mac_arm "$mac_arm" \
            --argjson appimage "$appimage" --argjson deb "$deb" \
            '{version: $version, pub_date: $date, notes: "See the release notes on GitHub.", platforms: {
              "windows-x86_64": $windows, "windows-x86_64-nsis": $windows,
              "darwin-x86_64": $mac_intel, "darwin-x86_64-app": $mac_intel,
              "darwin-aarch64": $mac_arm, "darwin-aarch64-app": $mac_arm,
              "linux-x86_64": $appimage, "linux-x86_64-appimage": $appimage,
              "linux-x86_64-deb": $deb
            }}' > artifacts/latest.json
          cat artifacts/latest.json
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.app.tar.gz
            artifacts/yt-dlp-desktop-ffmpeg-source-materials.tar.zst
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.app.tar.gz
            artifacts/**/*.sig
            artifacts/latest.json
            artifacts/SHA256SUMS-*.txt
            artifacts/yt-dlp-desktop-ffmpeg-source-materials.tar.zst
