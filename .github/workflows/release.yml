name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify tag, versions, and ancestry
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -1)" = "$version"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)" = "$version"
          test "$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)" = "$version"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ffmpeg-source-materials:
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Collect exact FFmpeg source and build materials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-materials
          curl --fail --location --retry 3 \
            https://github.com/BtbN/FFmpeg-Builds/archive/refs/tags/autobuild-2026-06-30-13-34.tar.gz \
            --output source-materials/FFmpeg-Builds-autobuild-2026-06-30-13-34.tar.gz
          curl --fail --location --retry 3 \
            https://github.com/FFmpeg/FFmpeg/archive/ce3c09c101c83add623774d414a9f9498caf5c25.tar.gz \
            --output source-materials/FFmpeg-ce3c09c101c83add623774d414a9f9498caf5c25.tar.gz
          curl --fail --location --retry 3 \
            https://github.com/FFmpeg/nv-codec-headers/archive/33a9ede8d9914299d9262539c576a15bd0a19621.tar.gz \
            --output source-materials/nv-codec-headers-33a9ede8d9914299d9262539c576a15bd0a19621.tar.gz
          curl --fail --location --retry 3 \
            https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n8.1.2.tar.gz \
            --output source-materials/FFmpeg-n8.1.2.tar.gz
          curl --fail --location --retry 3 \
            https://git.martin-riedl.de/ffmpeg/build-script/archive/bb1d6db29cee948f9685bcd69e6caf17d960662b.tar.gz \
            --output source-materials/martin-riedl-build-script-bb1d6db29cee948f9685bcd69e6caf17d960662b.tar.gz
          cp src-tauri/resources/FFMPEG_NOTICE.md source-materials/
          cp packaging/components.json source-materials/
          (
            cd source-materials
            sha256sum -- * > SHA256SUMS
          )
          tar --create --zstd --file yt-dlp-desktop-ffmpeg-source-materials.tar.zst source-materials
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-source-materials
          path: yt-dlp-desktop-ffmpeg-source-materials.tar.zst
          if-no-files-found: error

  package:
    needs: verify-release
    timeout-minutes: 60
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Prepare Windows sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-sidecars.ps1 -Target '${{ matrix.target }}'
      - name: Prepare Unix sidecars
        if: runner.os != 'Windows'
        run: ./scripts/prepare-sidecars.sh '${{ matrix.target }}'
      - name: Verify Windows sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-sidecars.ps1 -Target '${{ matrix.target }}'
      - name: Verify Unix sidecars
        if: runner.os != 'Windows'
        run: bash ./scripts/verify-sidecars.sh '${{ matrix.target }}'
      - run: pnpm tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Generate Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle" -Recurse -File -Include *.exe,*.msi | ForEach-Object {
            $name = $_.Name -replace ' ', '.'
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $name
          } | Set-Content -Encoding ascii "SHA256SUMS-${{ matrix.target }}.txt"
      - name: Generate Unix checksums
        if: runner.os != 'Windows'
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            name="$(basename "$file" | tr ' ' '.')"
            printf '%s  %s\n' "$(shasum -a 256 "$file" | awk '{print $1}')" "$name"
          done < <(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0) > "SHA256SUMS-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: error

  publish-release:
    needs: [package, ffmpeg-source-materials]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/yt-dlp-desktop-ffmpeg-source-materials.tar.zst
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/SHA256SUMS-*.txt
            artifacts/yt-dlp-desktop-ffmpeg-source-materials.tar.zst
